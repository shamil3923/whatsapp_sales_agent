name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt

      - name: Run tests
        env:
          # Keep the suite off any real credentials and away from the
          # checked-in data directory.
          WHATSAPP_ACCESS_TOKEN: test_token
          WHATSAPP_PHONE_NUMBER_ID: test_phone_number_id
          WHATSAPP_VERIFY_TOKEN: sales_agent_verify_token
          GOOGLE_API_KEY: test_google_api_key
        run: python -m pytest tests/ -v
